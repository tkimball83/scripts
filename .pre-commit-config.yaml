default_stages:
  - pre-commit

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args:
          - --fix
        files: \.(py)$

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.11.0  # last release supporting Python 3.9 (see .python-version)
    hooks:
      - id: black
        args:
          - --target-version=py39
        files: \.(py)$
        verbose: true

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args:
          - -i=2
          - -ci
